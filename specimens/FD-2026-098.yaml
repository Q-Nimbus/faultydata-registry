anatomy: "An engineer disconnected and then reconnected a power supply\n  in a BA data centre, the surge\
  \ damaged the systems it came back to,\n  and 75,000 passengers spent a bank holiday weekend learning\
  \ that \"the\n  computer says no\" scales internationally. The initial failure was\n  hardware; the\
  \ three-day collapse was recovery — systems coming back in\n  the wrong order, returning inconsistent\
  \ state, needing to be re-killed.\n\n  The signature models the recovery phase: mostly dead, occasionally\n\
  \  returns something that looks alive but is internally wrong — the\n  zombie window between \"outage\"\
  \ and \"actually back.\""
