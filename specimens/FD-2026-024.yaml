  date: "2022-06-21"
anatomy: |
  A routine network change in the busiest locations withdrew
    prefixes it shouldn't have, and nineteen cities briefly forgot how to
    internet. Not all of them — that would be honest work. Just enough
    that half your users saw errors while the other half refreshed
    smugly and concluded you were lying about the outage.

    This is the geographically-weighted coin flip, the failure mode that
    makes "works on my machine" an internationally distributed problem.
    Your client in London: dead. Your client in Frankfurt: fine. Your
    monitoring: split down the middle like a committee.

    Fifty-fifty success on a per-request basis — the specie of flakiness
    that survives retries by luck and dies by statistics. If your test
    suite retries three times and calls that resilience, this specimen
    passes it one time in eight and fails it seven. Which, if you think
    about it, is the point.
