anatomy: "An attacker got into Code Spaces' AWS console, demanded ransom,\n  and when refused deleted\
  \ everything — machines, volumes, snapshots, and\n  crucially the backups, which lived in the same account\
  \ as the things\n  they were backing up. The company announced it was closing within\n  twelve hours.\
  \ It remains the canonical proof that \"the backups are in\n  the cloud\" is not a sentence, it is a\
  \ location.\n\n  The signature is a 410 Gone, permanently. Not a 503 implying a future;\n  a headstone.\
  \ The only specimen in the registry where the correct\n  handling is to update your DR plan."
