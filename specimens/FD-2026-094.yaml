anatomy: "A winter storm hit, flights cancelled, and Southwest's crew\n  scheduling systems — ancient\
  \ by aviation standards, which is saying\n  something — could not track where anyone actually was. The\
  \ systems kept\n  cheerfully returning data; the data was just confidently, operationally\n  wrong,\
  \ and crews ended up phoning in manually to tell the airline where\n  they were standing. 16,700 flights\
  \ cancelled.\n\n  The worst response an API can give isn't an error — it's a confident,\n  well-formed,\
  \ stale answer. Everything 200s. Everything lies."
