anatomy: "A status code Cloudflare invented because the real upstream\n  did something so weird there\
  \ was no number for it — empty responses,\n  malformed headers, connections that reset mid-handshake.\
  \ The 5xx\n  bucket's junk drawer: officially \"unknown error,\" colloquially \"the\n  origin did a\
  \ thing and we're not explaining it.\"\n\n  Clients see it constantly in the wild and handle it badly,\
  \ because\n  it's not in any RFC and half the retry libraries don't classify it\n  as retryable. Spoiler:\
  \ it's a 5xx. It is extremely retryable."
