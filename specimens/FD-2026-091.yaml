anatomy: "For four days in November 2023 Cloudflare's edge kept happily\n  serving traffic while its control\
  \ plane — the dashboard, the APIs, the\n  logging and analytics — faceplanted, because the Flexential\
  \ data centres\n  hosting it lost power and the \"independent\" control plane turned out to\n  have\
  \ opinions about which buildings it lived in.\n\n  A gorgeous failure shape: the product works, the\
  \ management of the\n  product does not. Customers could serve traffic but couldn't configure,\n  observe,\
  \ or bill it. If your monitoring treats \"the API returns 200\" and\n  \"the API is usable\" as the\
  \ same check, this is the exhibit that ends\n  that complacency."
