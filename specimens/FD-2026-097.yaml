anatomy: "Robinhood's systems fell over on Monday March 2nd 2020 — one of\n  the largest single-day rallies\
  \ in Dow history — and again the next day\n  for good measure. Users watched a generational market move\
  \ through an\n  app that could do nothing but return errors. The cause, per the\n  postmortem: infrastructure\
  \ strain under record load, which is corporate\n  for \"success killed us too.\"\n\n  The signature\
  \ is load-shaped: mostly 429s and 502s, occasional\n  long-delayed success, and the growing suspicion\
  \ that retrying is making\n  everything worse for everyone including you."
