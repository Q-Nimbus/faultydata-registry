anatomy: "A botnet of compromised webcams and toasters — Mirai, because of\n  course your toaster has\
  \ a botnet — pointed roughly ten million devices at\n  Dyn's resolvers on a Friday morning. Twitter,\
  \ Spotify, Reddit, Netflix:\n  all technically running perfectly, all functionally dead, because the\n\
  \  phone book was on fire.\n\n  The responses were the worst kind: not errors, just absence. Queries\n\
  \  sailed into the void and came back as timeouts, which meant every client\n  in America learned the\
  \ same lesson simultaneously — your DNS timeout\n  configuration is your actual uptime configuration."
