anatomy: "A misconfigured router in Atlanta announced routes it had no\n  business announcing, traffic\
  \ got sucked into a backbone that couldn't\n  hold it, and for twenty-seven minutes Cloudflare — a company\
  \ whose\n  entire job is being reachable — was not. The postmortem's memorable\n  detail: some of their\
  \ own status infrastructure lived behind the same\n  congested paths, so for a while even the \"we are\
  \ investigating\" page\n  needed investigating.\n\n  The signature is partial reachability: some requests\
  \ get through, some\n  get eaten, and the client cannot tell the difference between \"the site\n  is\
  \ down\" and \"the road to the site is down\" — because there isn't one."
