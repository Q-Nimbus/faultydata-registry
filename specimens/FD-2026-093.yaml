anatomy: "A routine software upgrade at an upstream peer flooded Optus's\n  routers with more BGP route\
  \ announcements than their safety limits\n  allowed, the routers did the sensible thing and shut down\
  \ to protect\n  themselves, and ten million Australians woke up to a carrier that had\n  collectively\
  \ decided to take the day off. Roughly twelve hours for a\n  full recovery.\n\n  From the client's side\
  \ it presents as degraded-to-dead: long pauses,\n  intermittent 503s, occasional silence. The network\
  \ equivalent of a fuse\n  that blows every time you fix it."
