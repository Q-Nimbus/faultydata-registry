id: FD-2026-038
slug: lying-rate-limit-headers
title: Lying rate-limit headers
category: headers
severity: moderate
tests: [headers, retry-logic]
anatomy: |
  X-RateLimit-Remaining proudly announces seven requests left.
    The status line disagrees: 429, right now, hard no. The headers were
    computed by a different bucket than the one doing the enforcing —
    edge counts one thing, origin counts another, and each writes its
    own version of the truth like two witnesses to the same bar fight
    describing different fights.

    Clients that trust the counter walk confidently into the wall —
    the header said seven, so the retry logic scheduled seven more,
    each one bounced, each one decrementing a remaining count that was
    fictional to begin with. It's the API equivalent of a petrol gauge
    calibrated by a different car.

    The correct response is to trust the status code over the headers —
    status is enforced, headers are advisory, like the difference between
    a law and a leaflet. Your client will either learn that here or
    during a real rate-limit incident. Both are educational. Only one
    is funny.
signature:
  status: 429
  headers:
    X-RateLimit-Limit: "100"
    X-RateLimit-Remaining: "7"
    X-RateLimit-Reset: "1893456000"
    Retry-After: "5"
  body: '{"error":"rate limited"}'
tags: [rate-limit, headers]
