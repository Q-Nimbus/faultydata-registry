anatomy: "A pseudonymous maintainer spent two years earning commit rights\n  to xz — compression software\
  \ sitting inside half the world's Linux\n  installs — then slipped a remote-execution backdoor into\
  \ the release\n  tarballs. Caught by accident when Andres Freund noticed SSH taking\n  half a second\
  \ too long, roughly a week before it would've shipped into\n  every stable distro. The CVSS score was\
  \ a perfect 10.\n\n  The signature is terrifying in its politeness: a completely valid\n  response,\
  \ correct schema, correct version — plus one field that\n  shouldn't exist, patiently waiting for a\
  \ client that never inspects\n  what it accepts."
