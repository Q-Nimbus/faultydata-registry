citation:
  source: Google Cloud incident 19009 — June 2, 2019
  url: https://status.cloud.google.com/incident/cloud-networking/19009
  date: "2019-06-02"
anatomy: |
  A config change meant for a handful of servers was applied to a
  great many more, network capacity in the eastern US collapsed, and
  for four hours YouTube, Gmail, and a meaningful slice of everything
  built on GCP — including, delightfully, several companies whose
  entire pitch was "we're not on GCP" — degraded in unison. Turns out
  everyone is on GCP, spiritually.

  The signature is congestion, not death: requests that succeed after
  a geological delay, requests that fail fast, requests that succeed
  normally, interleaved with no pattern a health check can summarize.
  It is the failure mode where "is it up?" is the wrong question and
  "is it worth waiting for?" is the right one.

  Your client either has a latency budget or it has faith. This
  specimen tests which.
