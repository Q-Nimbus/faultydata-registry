anatomy: |
  Internal congestion separated AWS's control network from its data
    network in December 2021 — a polite way of saying the dashboard that
    tells you the dashboard is broken was also broken, and you found out
    about the outage from Twitter, which was also on AWS, which is a
    sentence that should never have been possible.

    API errors, stretched latencies, monitoring reporting on itself like
    a doctor who has fainted mid-diagnosis. The canonical illustration of
    why "watch us-east-1 from us-east-1" is not a monitoring strategy —
    it's a coincidence generator wearing a pager.

    Three flavours at once: outright 500s, requests that succeed after
    eight seconds of silent contemplation, and the occasional normal
    response to keep you guessing. Your client gets to decide which of
    three parallel universes each request belongs to. Good luck.
