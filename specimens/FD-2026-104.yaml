anatomy: "RFC 5842's contribution to the status code menagerie: 508, for\n  when the server detects an\
  \ infinite loop inside WebDAV property\n  traversal. Almost nothing emits it, almost nothing handles\
  \ it, and\n  clients that pattern-match \"5xx = retry\" will retry a request whose\n  defining characteristic\
  \ is that it can never terminate.\n\n  A fine test of whether your error handling reads the status or\
  \ just\n  the first digit."
