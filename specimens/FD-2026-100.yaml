id: FD-2026-100
slug: duplicate-content-length
title: Conflicting duplicate Content-Length headers
category: headers
severity: severe
tests:
- headers
- parsing
tags:
- headers
- raw
- smuggling-adjacent
anatomy: "Two Content-Length headers, two different values. HTTP/1.1\n  has rules for this — RFC 7230\
  \ says reject it — but \"says reject it\" and\n  \"your stack rejects it\" are separated by an implementation\
  \ detail that\n  has powered a decade of request-smuggling CVEs. One parser reads the\n  first, another\
  \ reads the second, and suddenly your proxy and your\n  backend disagree about where the request ends.\n\
  \n  Written raw, past Go's civilised header handling, because a conforming\n  HTTP stack literally cannot\
  \ emit this — which is the whole point."
signature:
  raw: "HTTP/1.1 200 OK\r\nContent-Length: 5\r\nContent-Length: 64\r\nContent-Type: application/json\r\
    \nConnection: close\r\n\r\n{\"id\":1,\"name\":\"what the proxy saw != what the backend saw\"}"
